spring.application.name=Pr1_dss

# Usara la bd H2 ejecutandose en memoria RAM(mem) con el nombre (testdb)
spring.datasource.url=jdbc:h2:mem:testdb  
# el controlador de java para comunicarse con h2
spring.datasource.driverClassName=org.h2.Driver 
# credenciales de ls bd
spring.datasource.username=sa 
spring.datasource.password= 
# activa la interfaz web para ver la bd con http://localhost:8080/h2-console
spring.h2.console.enabled=true 
# analiza las clases con @Entity y las crea/actualiza en bd al arrancar la app
spring.jpa.hibernate.ddl-auto=update
# muestra en la consola las sentencias sql 
spring.jpa.show-sql=true 
# indica la variante de sql que debe traducir para entender h2
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect 

# Thymeleaf 
# desactiva la cache
spring.thymeleaf.cache=false 
# indica donde buscar los archivos de la interfaz grafica y su extension
spring.thymeleaf.prefix=classpath:/templates/ 
spring.thymeleaf.suffix=.html 

# Authentication 
spring.security.user.name=admin 
spring.security.user.password=admin 
spring.security.user.roles=ADMIN 